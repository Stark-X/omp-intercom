name: Release merged compatibility repair

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: read

jobs:
  release:
    name: Bump the patch version on master and publish a GitHub Release
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'automation/intercom-compatibility/') &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.merged_by.login == (vars.INTERCOM_REVIEWER || github.repository_owner)
    concurrency:
      group: intercom-release-master
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Publish the reviewed repair
        env:
          GH_TOKEN: ${{ github.token }}
          COMPATIBILITY_PR: ${{ github.event.pull_request.number }}
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: bash .github/scripts/release.sh
