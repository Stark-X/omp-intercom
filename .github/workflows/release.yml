name: Release merged pull request

on:
  pull_request_target:
    types: [closed]
    branches: [master]

permissions:
  contents: read

jobs:
  release:
    name: Bump the patch version on master and publish a GitHub Release
    if: github.event.pull_request.merged == true
    concurrency:
      group: intercom-release-master
      queue: max
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # This job can write to the repository. Load the release script from master.
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Publish the merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ github.event.pull_request.number }}
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: bash .github/scripts/release.sh
